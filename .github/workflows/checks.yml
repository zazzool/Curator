# Сторож: обязательные проверки на каждый push и каждый PR.
#
# # Один файл на двух сторожей
#
# Этот файл читают И Forgejo (exam.psync.ru), И GitHub Actions. Решение
# владельца 19.09.2026: сторожей двое, потому что репозиторий публичный —
# Actions видны всякому, кто смотрит на PR, а Forgejo стоит там же, где
# боевой контур, и знает про него то, чего GitHub знать не должен.
#
# Каталог .github/workflows выбран не по привычке: Forgejo читает именно
# его, и переезд сломал бы одного из двух. Файл написан так, чтобы идти в
# обоих, поэтому в нём нет ничего, чего нет у обоих: ни кэшей, ни
# матриц, ни действий сверх трёх общеизвестных.
#
# # Секретов здесь нет и быть не может
#
# Репозиторий публичный. База поднимается своя, одноразовая, с паролем,
# который тут же и написан: он живёт полторы минуты внутри одного прогона
# и не значит ничего. Никаких донорских доступов — ни к моделям, ни к
# боевой базе, ни к почте — сторожу не нужно: он гоняет проверки, а не
# выкатывает.
#
# # Версия Go берётся из go.mod, а не пишется здесь
#
# Два места для одной версии расходятся молча. go.mod — единственное
# место, где версия Go названа, и сторож читает её оттуда. Node и Flutter
# назвать больше негде, поэтому они названы здесь — и здесь же
# единственный раз.
name: Проверки

on:
  push:
  pull_request:

# Права выданы поимённо, и выданы одни: читать дерево. Без этого блока
# работе достаются права по умолчанию, а они у GitHub настраиваются на
# уровне репозитория и по умолчанию шире нужного. Проверки не пишут ни
# строки — ни метки, ни отзыва, ни выпуска, — и права на запись им нужны
# ровно затем, чтобы однажды ими воспользовался не тот, кто их просил.
permissions:
  contents: read

jobs:
  checks:
    name: Обязательные проверки
    # Метка закреплена, а не `ubuntu-latest`. Сторожей двое, и у раннера
    # Forgejo метка ровно одна — `ubuntu-24.04`. На `ubuntu-latest` этот
    # файл гонял ОДИН сторож из двух: на Forgejo прогон вставал в очередь
    # и стоял там молча, потому что незнакомая метка — не отказ, а
    # ожидание исполнителя. Проверок, которые никогда не начинались, не
    # видно ни в красном, ни в зелёном (замерено 20.09.2026).
    #
    # GitHub `ubuntu-24.04` понимает тоже, так что один файл по-прежнему
    # годится обоим. У донора та же метка и тот же довод.
    runs-on: ubuntu-24.04

    # Срок на работу. Висящий прогон занимает исполнителя и держит очередь
    # до шести часов умолчания, а весь набор идёт минут десять: зависнуть
    # он может на скачивании набора Flutter или на базе, не поднявшейся до
    # готовности. Полчаса — это «что-то сломалось», а не «сегодня долго».
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: curator
          POSTGRES_PASSWORD: curator
          POSTGRES_DB: curator_checks
        ports:
          - 5432:5432
        # Без ожидания готовности первый же запрос приходит в ещё не
        # поднявшуюся базу, и отказ выглядит как отказ схемы.
        options: >-
          --health-cmd "pg_isready -U curator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # psql нужен набору на ветках, где ещё нет сервера: там схема
      # накатывается им напрямую. На части образов его нет.
      - name: Клиент postgres
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      # Адрес базы у двух сторожей разный, и это их устройство, а не
      # настройка. GitHub отображает порт службы на хост раннера, и туда
      # ходят по 127.0.0.1. Forgejo (act) поднимает службу отдельным
      # контейнером в сети прогона и на хост её порт не отображает вовсе
      # — 127.0.0.1 там отвечает «connection refused», зато сама служба
      # отзывается по своему имени. Одного значения, годного обоим, не
      # существует: это замерено первым же живым прогоном на Forgejo
      # 20.09.2026, где набор упал, не дойдя до первой проверки.
      #
      # Поэтому адрес не пишется, а СПРАШИВАЕТСЯ у сети. Не ответил никто
      # — шаг падает здесь и вслух: набор, оставшийся без строки
      # подключения, пропустил бы проверки на живой базе молча, а это
      # ровно та подделка, от которой стерегут наборы (см. CLAUDE.md).
      #
      # 127.0.0.1, а не localhost: localhost на части образов
      # разворачивается в ::1, база слушает IPv4, и отказ читался бы как
      # «база не поднялась», хотя она поднялась.
      - name: Адрес базы
        run: |
          set -euo pipefail
          for host in 127.0.0.1 postgres; do
              if pg_isready -q -h "$host" -p 5432 -U curator; then
                  echo "База отвечает на $host."
                  echo "CURATOR_TEST_DSN=postgres://curator:curator@$host:5432/curator_checks?sslmode=disable" \
                      >> "$GITHUB_ENV"
                  exit 0
              fi
          done
          echo "База не отвечает ни на 127.0.0.1, ни на postgres." >&2
          echo "Проверки на живой базе гонять не по чему — это отказ, а не повод их пропустить." >&2
          exit 1

      # Go и Node ставятся, только если есть что ими собирать. Это не
      # пропуск проверок: сам набор идёт всегда и сам решает, что в дереве
      # есть. Пропускается установка ИНСТРУМЕНТА под код, которого в ветке
      # нет, — а появится код без go.mod, набор упадёт на нём вслух.
      #
      # Первый прогон сторожа упал ровно здесь: файл завёлся веткой от
      # main, где сервера ещё нет, и setup-go отказал на «нет такого
      # go.mod». Условие дешевле, чем помнить об этом.
      - name: Go
        if: hashFiles('server/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Node
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Flutter ставится руками, а не готовым действием. Цена названа
      # вслух: полтора гигабайта на каждый прогон, минуты три. Взамен —
      # уверенность, что оба сторожа поставят одно и то же: готовое
      # действие пришлось бы проверять на Forgejo, а проверить его там
      # можно только сломав всех, кто ждёт зелёного.
      #
      # Кэша нет намеренно, как и у остальных шагов: кэш — это четвёртое
      # действие, ведущее себя у двух сторожей по-разному.
      - name: Flutter
        if: hashFiles('app/pubspec.yaml') != ''
        run: |
          set -euo pipefail
          FLUTTER_VERSION=3.41.2
          # Отпечаток архива — из описи выпусков самого Google, взят
          # 2026-09-20. Меняется ТОЛЬКО ПАРОЙ с версией строкой выше: две
          # правки врозь дают либо негодную проверку, либо остановившийся
          # сторож, и обе выглядят одинаково.
          #
          # Пишется здесь, а не читается из той же описи: тот, кто сможет
          # подменить архив, подменит и опись. Записанный у нас отпечаток —
          # единственное, что этого не даёт.
          FLUTTER_SHA256=4a04f8a6152986d14fc137ffaf98106ca743c0f9ab66f1bc2f20ee84eb573e5c
          base=https://storage.googleapis.com/flutter_infra_release/releases/stable/linux
          curl -sSL -o /tmp/flutter.tar.xz "$base/flutter_linux_$FLUTTER_VERSION-stable.tar.xz"
          echo "$FLUTTER_SHA256  /tmp/flutter.tar.xz" | sha256sum -c -
          tar xf /tmp/flutter.tar.xz -C /opt
          rm /tmp/flutter.tar.xz
          # Набор распакован не тем, кто его запускает, и git считает
          # такой каталог чужим — а flutter зовёт git при первом запуске.
          git config --global --add safe.directory /opt/flutter
          echo /opt/flutter/bin >> "$GITHUB_PATH"

      - name: Обязательные проверки
        run: ./tools/checks.sh

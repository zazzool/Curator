name: curator
description: "Куратор: учебные ситуационные задачи для врачей."
publish_to: 'none'

# Номер сборки растёт с каждой выкладкой: по нему установленное приложение
# понимает, что вышло новое. Имя версии видит человек, номер — механика.
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Нужда названа вслух: токен устройства обязан пережить перезапуск.
  # Не переживи он — приложение заводило бы новую учётную запись при
  # каждом запуске, и врач терял бы прогресс, не понимая почему. Записать
  # его в файл самим нельзя: каталог приложения тоже даёт только плагин, и
  # тот был бы больше этого.
  shared_preferences: ^2.3.2

  # Нужда названа вслух: выпуск набора подписан ed25519, и проверить
  # подпись стандартной библиотекой Dart нечем — в ней нет ни ed25519, ни
  # sha256. Без проверки подписи набор ставить нельзя: между устройством и
  # сервером чужая сеть, и подменить содержание по дороге может всякий, кто
  # в ней сидит.
  cryptography: ^2.7.0

  # Нужда названа вслух: набор ставится на устройство целиком и должен
  # пережить перезапуск. Настройки для него не место — набор на тысячу
  # задач весит мегабайты, а настройки на Android читаются в память
  # целиком при запуске приложения. Каталог, куда можно писать, даёт
  # только плагин: адреса такого каталога в стандартной библиотеке Dart
  # нет.
  path_provider: ^2.1.6

  # Нужда названа вслух: повторение по расписанию обязано работать без
  # сети, а расписание — это состояние у каждой задачи, которое читается
  # выборкой «что просрочено на сегодня». Файлами такое читается перебором
  # всего, что лежит, и на тысяче задач это заметно врачу. Своя же
  # выборка поверх файлов — это вторая реализация базы, написанная хуже.
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Нужда названа вслух: настоящий sqflite живёт на устройстве, и в
  # проверке на машине его нет. Без этого миграции местной базы
  # проверялись бы только на телефоне — то есть уже после выкладки, а
  # ошибка в миграции стирает прогресс на установленных устройствах.
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true

  # Golos Text — вариативный шрифт (ось wght 400–900), спроектированный под
  # кириллицу. Лежит в сборке, а не тянется из сети: приложение обязано
  # работать без сети, а шрифт, подгружаемый на ходу, сменил бы начертание
  # посреди чтения — там, где врач уже читает.
  #
  # Тот же шрифт стоит в студии и у приложения-донора: одно семейство на
  # оба экрана — это и есть «выглядит одинаково», всё остальное вторично.
  #
  # Лицензия SIL OFL 1.1 разрешает распространение в составе программы при
  # условии, что текст лицензии едет вместе со шрифтом; он рядом, в
  # assets/fonts/GolosText-OFL.txt.
  #
  # Начертания задаются через FontVariation в теме, а не отдельными
  # файлами: у вариативного шрифта один файл на всю ось, и `fontWeight`
  # без `fontVariations` его не двигает — буквы остаются обычными.
  fonts:
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText.ttf

# SOCKS5 без аутентификации, доступный только изнутри сети docker.
#
# Пароль здесь ничего не добавил бы: порт наружу не публикуется, а тот,
# кто попал в сеть контейнеров, уже имеет доступ и к самому серверу.

logoutput: stderr
internal: 0.0.0.0 port = 1080
external: awg0

socksmethod: none
clientmethod: none

user.notprivileged: nobody

# Принимаем только из частных сетей: docker раздаёт адреса оттуда.
client pass {
    from: 172.16.0.0/12 to: 0.0.0.0/0
    log: error
}
client pass {
    from: 10.0.0.0/8 to: 0.0.0.0/0
    log: error
}
client pass {
    from: 192.168.0.0/16 to: 0.0.0.0/0
    log: error
}

# Наружу — куда угодно, но только через awg0: внешний интерфейс задан выше.
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    protocol: tcp udp
    log: error
}
